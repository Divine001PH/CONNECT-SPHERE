<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConnectSphere — Sign Up</title>
  <link rel="stylesheet" href="css folder/global.css" />
  <link rel="stylesheet" href="css folder/auth.css"/>
</head>

<body>

  <!-- Decorative Background Blobs -->
  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>
  <div class="blob blob-3" aria-hidden="true"></div>
  <div class="blob blob-4" aria-hidden="true"></div>

  <!-- Main Page Wrapper -->
  <main class="auth-wrapper">

    <article class="card">

      <!-- Card Header -->
      <header class="card-header">
        <h1 class="logo">Connect<span>Sphere</span></h1>
        
        <p class="tagline">Where students connect</p>
      </header>

      <!-- Signup Form -->
<section class="card-body">
  <form action="#" method="POST" novalidate id="signup-form">

    <p id="signup-error" class="form-error" style="display:none;"></p>

    <fieldset>
      <legend class="sr-only">Personal Information</legend>

      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input
          type="text"
          id="fullname"
          name="fullname"
          placeholder="e.g. John Doe"
          autocomplete="name"
          required
        />
      </div>

      <div class="form-group">
        <label for="department">Department</label>
        <select id="department" name="department" required>
          <option value="" disabled selected>Select your department</option>
          <option value="Computer Science">Computer Science</option>
          <option value="Electrical Engineering">Electrical Engineering</option>
          <option value="Mechanical Engineering">Mechanical Engineering</option>
          <!-- Add more departments as needed -->
        </select>
      </div>

      <div class="form-group">
        <label for="level">Level</label>
        <select id="level" name="level" required>
          <option value="" disabled selected>Select your level</option>
          <option value="100">100 Level</option>
          <option value="200">200 Level</option>
          <option value="300">300 Level</option>
          <option value="400">400 Level</option>
          <option value="500">500 Level</option>
        </select>
      </div>

    </fieldset>

    <fieldset>
      <legend class="sr-only">Account Credentials</legend>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="e.g. johndoe@university.edu"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Create a strong password"
          autocomplete="new-password"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input
          type="password"
          id="confirm-password"
          name="confirm-password"
          placeholder="Repeat your password"
          autocomplete="new-password"
          required
        />
      </div>

    </fieldset>

    <button type="submit" class="btn-primary" id="signup-btn">Create Account</button>

  </form>
</section>

      <!-- Card Footer -->
      <footer class="card-footer">
        <p>Already have an account? <a href="login.html">Log in</a></p>
      </footer>

    </article>

  </main>

<script>
  const signupForm = document.getElementById('signup-form');
  const signupError = document.getElementById('signup-error');
  const signupBtn = document.getElementById('signup-btn');

  const API_BASE = 'https://solid-spork-q76rj45r4vv924jvx-5501.app.github.dev/api'; // Replace with your actual API base URL

  signupForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    signupError.style.display = 'none';

    const fullname = document.getElementById('fullname').value.trim();
    const department = document.getElementById('department').value;
    const level = document.getElementById('level').value;
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm-password').value;

    if (!fullname || !department || !level || !email || !password || !confirmPassword) {
      signupError.textContent = 'Please fill in all fields';
      signupError.style.display = 'block';
      return;
    }

    if (password !== confirmPassword) {
      signupError.textContent = 'Passwords do not match';
      signupError.style.display = 'block';
      return;
    }

    if (password.length < 6) {
      signupError.textContent = 'Password must be at least 6 characters';
      signupError.style.display = 'block';
      return;
    }

    signupBtn.disabled = true;
    signupBtn.textContent = 'Creating Account...';

    try {
      const response = await fetch(`${API_BASE}/signup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullname, email, password, department, level }),
      });

      const data = await response.json();

      if (!response.ok) {
        signupError.textContent = data.message || 'Something went wrong';
        signupError.style.display = 'block';
        signupBtn.disabled = false;
        signupBtn.textContent = 'Create Account';
        return;
      }

      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));

      window.location.href = 'feed.html';

    } catch (error) {
      signupError.textContent = 'Could not connect to server. Please try again.';
      signupError.style.display = 'block';
      signupBtn.disabled = false;
      signupBtn.textContent = 'Create Account';
    }
  });
</script>

    </a>

      <span class="mobile-nav-icon">📅</span>
      <span>Events</span>
    </a>
    <a href="profile.html" class="mobile-nav-item">
      <span class="mobile-nav-icon">👤</span>
      <span>Profile</span>

  </div>
</nav>

<!-- Sidebar Overlay (mobile) -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>
</body>

</html>
