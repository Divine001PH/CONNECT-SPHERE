<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConnectSphere — Log In</title>
  <link rel="stylesheet" href="css folder/global.css" />
  <link rel="stylesheet" href="css folder/auth.css" />
</head>

<body>

  <!-- Decorative Background Blobs -->
  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>
  <div class="blob blob-3" aria-hidden="true"></div>
  <div class="blob blob-4" aria-hidden="true"></div>

  <!-- Main Page Wrapper -->
  <main class="auth-wrapper">

    <article class="card">

      <!-- Card Header -->
      <header class="card-header">
        <h1 class="logo">Connect<span>Sphere</span></h1>
        <p class="tagline">Welcome back 👋</p>
      </header>

      <!-- Login Form -->
      <section class="card-body">
        <form action="#" method="POST" novalidate id="login-form">
          <p id="login-error" class="form-error" role="alert" style="display:none;"></p>

          <fieldset>
            <legend class="sr-only">Login Credentials</legend>

            <div class="form-group">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
              />
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
            </div>

          </fieldset>

          <div class="forgot-password">
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary">Log In</button>

        </form>
      </section>

      <!-- Card Footer -->
      <footer class="card-footer">
        <p>Don't have an account? <a href="signup.html">Sign up</a></p>
      </footer>

    </article>

  </main>

  <script>
  const loginForm = document.getElementById('login-form');
  const loginError = document.getElementById('login-error');
  const loginBtn = loginForm.querySelector('button[type="submit"]');

  function getAuthApiBase() {
    if (window.CONNECTSPHERE_API_BASE) {
      return window.CONNECTSPHERE_API_BASE.replace(/\/$/, '');
    }

    const isLocalFrontend = window.location.protocol === 'file:' ||
      ((window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') &&
       window.location.port !== '5000');

    return isLocalFrontend ? 'http://localhost:5000/api/auth' : `${window.location.origin}/api/auth`;
  }

  function showLoginMessage(message, isSuccess = false) {
    loginError.textContent = message;
    loginError.classList.toggle('success', isSuccess);
    loginError.style.display = 'block';
  }

  loginForm.addEventListener('submit', async function(e) {
    e.preventDefault();
    loginError.style.display = 'none';
    loginError.classList.remove('success');

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      showLoginMessage('Please provide email and password');
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = 'Logging In...';

    try {
      const response = await fetch(`${getAuthApiBase()}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      const data = await response.json();

      if (!response.ok) {
        showLoginMessage(data.message || 'Unable to log in');
        return;
      }

      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      showLoginMessage('Login successful. Redirecting...', true);
      window.location.href = 'feed.html';
    } catch (error) {
      showLoginMessage('Could not connect to server. Please try again.');
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Log In';
    }
  });
</script>

</body>

</html>
